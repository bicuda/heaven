<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky & Nebula Gradients -->
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14112c" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0a0c18" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#04050a" stop-opacity="1" />
    </radialGradient>

    <!-- Universe 1: MU Online Dark Lorencia & +15 Wings (Left) -->
    <radialGradient id="muWingsGlow" cx="20%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3b0764" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="muLightning" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Universe 2: Ragnarok Prontera & Golden Yggdrasil (Center) -->
    <radialGradient id="roSanctumGlow" cx="50%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Universe 3: Pokemon Mystical Wilds & Elemental Energy (Right) -->
    <radialGradient id="pkmWildsGlow" cx="80%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#064e3b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Master Vignette Overlay for Readability -->
    <radialGradient id="vignetteOverlay" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#05070c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#05070c" stop-opacity="0.95" />
    </radialGradient>
  </defs>

  <!-- Deep Cosmos Base Background -->
  <rect width="1920" height="1080" fill="url(#skyGlow)" />

  <!-- Stars & Constellations -->
  <g opacity="0.6">
    <circle cx="180" cy="120" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="340" cy="210" r="2" fill="#c084fc" opacity="0.9" />
    <circle cx="520" cy="90" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="780" cy="160" r="2.5" fill="#fde68a" opacity="0.9" />
    <circle cx="960" cy="80" r="1.5" fill="#ffffff" opacity="0.8" />
    <circle cx="1140" cy="190" r="2" fill="#a7f3d0" opacity="0.8" />
    <circle cx="1380" cy="110" r="1.8" fill="#67e8f9" opacity="0.9" />
    <circle cx="1560" cy="240" r="2" fill="#fef08a" opacity="0.7" />
    <circle cx="1780" cy="130" r="2.2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- LEFT REALM: MU ONLINE (Gothic Citadel, Dark Knight Precipice & Archangel Wings) -->
  <rect width="1920" height="1080" fill="url(#muWingsGlow)" />

  <!-- MU Gothic Fortress Silhouettes -->
  <path d="M 0 1080 L 0 540 L 90 480 L 140 520 L 190 380 L 230 380 L 260 520 L 330 460 L 380 500 L 460 320 L 490 320 L 530 510 L 640 620 L 720 1080 Z" fill="#090514" opacity="0.95" />
  <path d="M 120 1080 L 200 480 L 220 480 L 270 590 L 390 410 L 430 410 L 490 640 L 610 1080 Z" fill="#130b26" opacity="0.6" />

  <!-- MU +15 Archangel Radiant Wings -->
  <g opacity="0.45" transform="translate(180, 320)">
    <!-- Left Wing Feathers -->
    <path d="M 120 120 C 60 40, -40 80, -90 160 C -120 220, -100 290, -40 330 C 0 300, 60 240, 120 120 Z" fill="#a855f7" filter="blur(3px)" />
    <path d="M 120 120 C 80 20, 0 40, -50 110 C -80 170, -60 230, 0 250 C 40 220, 80 180, 120 120 Z" fill="#38bdf8" opacity="0.6" />
    <!-- Right Wing Feathers -->
    <path d="M 120 120 C 180 40, 280 80, 330 160 C 360 220, 340 290, 280 330 C 240 300, 180 240, 120 120 Z" fill="#a855f7" filter="blur(3px)" />
    <path d="M 120 120 C 160 20, 240 40, 290 110 C 320 170, 300 230, 240 250 C 200 220, 160 180, 120 120 Z" fill="#38bdf8" opacity="0.6" />
    <!-- Center Warrior Silhouette with Archangel Sword -->
    <polygon points="120,70 125,180 115,180" fill="#e9d5ff" />
    <line x1="100" y1="100" x2="140" y2="100" stroke="#c084fc" stroke-width="4" />
  </g>

  <!-- Lightning bolts across Lorencia sky -->
  <path d="M 80 80 L 140 180 L 120 200 L 190 320" stroke="url(#muLightning)" stroke-width="2" fill="none" opacity="0.6" />

  <!-- CENTER REALM: RAGNAROK ONLINE (Prontera Cathedral Spires & Yggdrasil Tree) -->
  <rect width="1920" height="1080" fill="url(#roSanctumGlow)" />

  <!-- Midgard Mountain Range Backdrop -->
  <path d="M 520 1080 L 680 580 L 820 670 L 960 480 L 1100 650 L 1240 560 L 1420 1080 Z" fill="#0d0e1a" opacity="0.8" />

  <!-- Prontera Grand Castle & Cathedral Silhouette -->
  <g fill="#171322">
    <!-- Main Center Tower -->
    <path d="M 910 680 L 910 390 L 960 300 L 1010 390 L 1010 680 Z" />
    <!-- Cross / Valkyrie Crest on Cathedral -->
    <line x1="960" y1="260" x2="960" y2="310" stroke="#f59e0b" stroke-width="3" opacity="0.8" />
    <line x1="945" y1="275" x2="975" y2="275" stroke="#f59e0b" stroke-width="3" opacity="0.8" />
    <!-- Spires & Walls -->
    <path d="M 820 680 L 820 440 L 850 380 L 880 440 L 880 680 Z" />
    <path d="M 1040 680 L 1040 440 L 1070 380 L 1100 440 L 1100 680 Z" />
    <path d="M 780 680 L 1140 680 L 1140 760 L 780 760 Z" />
  </g>

  <!-- Floating Golden Yggdrasil Sakura / Rune Petals -->
  <g opacity="0.7">
    <ellipse cx="880" cy="340" rx="6" ry="3" fill="#fbbf24" transform="rotate(25 880 340)" />
    <ellipse cx="940" cy="240" rx="7" ry="4" fill="#fde047" transform="rotate(-35 940 240)" />
    <ellipse cx="1020" cy="310" rx="5" ry="3" fill="#f59e0b" transform="rotate(45 1020 310)" />
    <ellipse cx="910" cy="420" rx="8" ry="4" fill="#fef08a" transform="rotate(15 910 420)" />
    <ellipse cx="1060" cy="400" rx="6" ry="3" fill="#fbbf24" transform="rotate(-20 1060 400)" />
  </g>

  <!-- Poring Silhouette hints in field -->
  <g fill="#f59e0b" opacity="0.5">
    <ellipse cx="760" cy="740" rx="18" ry="14" />
    <circle cx="766" cy="730" r="3" fill="#ffffff" />
    <ellipse cx="1180" cy="750" rx="22" ry="16" />
    <circle cx="1187" cy="738" r="4" fill="#ffffff" />
  </g>

  <!-- RIGHT REALM: POKÉMON IDLE (Mystical Glowing Wilderness & Dragon/Creature Spirit) -->
  <rect width="1920" height="1080" fill="url(#pkmWildsGlow)" />

  <!-- Mystic Forest Canopy Silhouettes -->
  <path d="M 1320 1080 C 1360 840, 1420 620, 1500 580 C 1580 540, 1680 640, 1740 520 C 1800 420, 1880 500, 1920 460 L 1920 1080 Z" fill="#061311" opacity="0.95" />
  <path d="M 1440 1080 C 1490 890, 1580 720, 1660 690 C 1740 660, 1820 740, 1920 680 L 1920 1080 Z" fill="#0b2420" opacity="0.6" />

  <!-- Mythical Dragon / Creature Silhouette in Flight (Charizard / Rayquaza aura) -->
  <g opacity="0.45" transform="translate(1620, 260)">
    <!-- Wings of elemental fire/energy -->
    <path d="M 40 80 Q -60 -40 -120 40 Q -70 80 0 90 Z" fill="#10b981" />
    <path d="M 40 80 Q 140 -40 200 40 Q 150 80 80 90 Z" fill="#34d399" />
    <!-- Dragon Head & Horns -->
    <polygon points="40,30 30,50 50,50" fill="#6ee7b7" />
    <line x1="30" y1="35" x2="15" y2="10" stroke="#34d399" stroke-width="3" />
    <line x1="50" y1="35" x2="65" y2="10" stroke="#34d399" stroke-width="3" />
    <!-- Glowing Tail Fire / Electric Spark -->
    <circle cx="40" cy="140" r="10" fill="#facc15" filter="blur(2px)" />
    <circle cx="40" cy="140" r="5" fill="#ffffff" />
  </g>

  <!-- Floating Elemental Energy Orbs / Poké-spheres in Wilds -->
  <g opacity="0.65">
    <circle cx="1520" cy="460" r="7" fill="#34d399" filter="blur(1px)" />
    <circle cx="1520" cy="460" r="3" fill="#ffffff" />
    <circle cx="1720" cy="380" r="9" fill="#38bdf8" filter="blur(1px)" />
    <circle cx="1720" cy="380" r="4" fill="#ffffff" />
    <circle cx="1840" cy="490" r="8" fill="#facc15" filter="blur(1px)" />
    <circle cx="1840" cy="490" r="3.5" fill="#ffffff" />
  </g>

  <!-- Ambient Cinematic Scrim Overlay (Ensures Text Legibility) -->
  <rect width="1920" height="1080" fill="url(#vignetteOverlay)" />
  <rect width="1920" height="1080" fill="linear-gradient(to bottom, rgba(5,7,12,0.5) 0%, rgba(5,7,12,0.2) 40%, rgba(5,7,12,0.85) 85%, #05070c 100%)" />
</svg>
